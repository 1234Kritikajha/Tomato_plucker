# =============================================================================
# Tomato Plucker — YOLO Dataset Configuration
# =============================================================================
# Used by Ultralytics YOLO training:
#   model.train(data="pipeline/training/dataset.yaml", ...)
#
# IMPORTANT: Paths below are relative to the `path` key (project root).
# The pipeline auto-generates this file with the correct absolute path
# before training starts (see pipeline/training/trainer.py).
# =============================================================================

# Absolute path to dataset root — dynamically injected by trainer.py
# (placeholder; overwritten at training time)
path: PLACEHOLDER_DATASET_PATH

# Sub-directories inside `path`
train: augmented/train/images
val:   augmented/val/images

# Number of classes
nc: 5

# Class names — ORDER MATTERS: index matches YOLO label integers
# 0=Unripe, 1=Half-Ripe, 2=Ripe, 3=Healthy, 4=Damaged
names:
  0: Unripe
  1: Half-Ripe
  2: Ripe
  3: Healthy
  4: Damaged

# =============================================================================
# Semantic heads (informational only — not used by YOLO directly)
# =============================================================================
# Ripeness head  : 0 (Unripe), 1 (Half-Ripe), 2 (Ripe)
# Condition head : 3 (Healthy), 4 (Damaged)
