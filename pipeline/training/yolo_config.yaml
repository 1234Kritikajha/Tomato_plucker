# =============================================================================
# Tomato Plucker — YOLO Augmentation Hyperparameters
# =============================================================================
# These hyp values are passed to model.train(cfg=...) and control
# YOLO's own internal augmentation pipeline.
#
# Since we already apply heavy offline augmentation via Albumentations
# (augmentor.py), YOLO's internal augmentation is kept conservative here
# to avoid double-augmentation and colour-space collisions.
# =============================================================================

# Learning rate and scheduler
lr0: 0.01           # initial learning rate (SGD=1E-2, Adam=1E-3)
lrf: 0.01           # final lr = lr0 * lrf
momentum: 0.937     # SGD momentum / Adam beta1
weight_decay: 0.0005

# Warmup
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss weights
box: 7.5            # box loss gain
cls: 0.5            # class loss gain
dfl: 1.5            # distribution focal loss gain

# --- YOLO internal augmentation (conservative — Albumentations handles heavy aug) ---
# Mosaic is disabled because we already augment offline; enable to 0.3-1.0 if desired
mosaic: 0.0         # mosaic augmentation (probability) — set 0.0 to disable
mixup: 0.0          # MixUp augmentation probability
copy_paste: 0.0     # segment copy-paste probability

# Spatial
degrees: 5.0        # image rotation (±deg)
translate: 0.05     # image translation (±fraction)
scale: 0.3          # image scale (±gain)
shear: 0.0          # image shear (±deg)
perspective: 0.0    # image perspective (±fraction, range 0-0.001)
flipud: 0.1         # image flip up-down probability
fliplr: 0.5         # image flip left-right probability

# Photometric (disabled — handled by Albumentations)
hsv_h: 0.0          # image HSV-Hue augmentation (fraction)
hsv_s: 0.0          # image HSV-Saturation augmentation (fraction)
hsv_v: 0.0          # image HSV-Value augmentation (fraction)

# Close mosaic (used in final epochs)
close_mosaic: 10    # disable mosaic augmentation for final N epochs

# Label smoothing
label_smoothing: 0.0

# Anchor-free settings (YOLOv8)
nbs: 64             # nominal batch size
overlap_mask: true
mask_ratio: 4
dropout: 0.0
